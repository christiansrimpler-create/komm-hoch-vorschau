hero:
  dachzeile: "Ausbildung im Dachdeckerhandwerk, Westfalen"
  headline: "Dachdecker:in werden.<br>Ohne Bewerbungsstress."
  text: "Hol dir das Infopaket zur Ausbildung: Was du verdienst, wie die Ausbildung läuft, was dich in Eslohe erwartet. Danach melden wir uns und suchen mit dir einen Ausbildungsbetrieb in deiner Nähe."
  fakten:
    - zahl: "1.050 €"
      text: "schon im 1. Lehrjahr"
    - zahl: "3 Jahre"
      text: "dann Gesell:in, später Meister:in"
    - zahl: "0 €"
      text: "kostet dich das Infopaket"

formular:
  titel: "Infopaket anfordern"
  untertitel: "Dauert eine Minute. Kommt per E-Mail."
  button: "Infopaket schicken"
  felder:
    vorname: "Vorname"
    email: "E-Mail"
    plz: "Postleitzahl"
    plz_hinweis: "Damit wir Betriebe in deiner Nähe finden"
    geburtsjahr: "Geburtsjahr"
    handy: "Handynummer"
    handy_hinweis: "Darüber melden wir uns, per WhatsApp oder Anruf."
    start: "Wann willst du starten?"
    start_optionen:
      - "Sofort"
      - "Sommer 2027"
      - "Sommer 2028"
      - "Noch offen"
    rolle: "Ich frage an als"
    rolle_optionen:
      - wert: "jugendlich"
        label: "Schüler:in"
      - wert: "eltern"
        label: "Elternteil"
      - wert: "quereinstieg"
        label: "Quereinsteiger:in"
  einwilligung_datenschutz: "Ich habe die <a href=\"/datenschutz/\">Datenschutzhinweise</a> gelesen. Meine Angaben werden zur Zusendung des Infopakets und zur Vermittlung an Ausbildungsbetriebe verwendet."
  einwilligung_kontakt: "Ja, ihr dürft mich per E-Mail, Telefon oder WhatsApp zur Dachdecker-Ausbildung kontaktieren. Ich kann das jederzeit widerrufen."
  unter16_hinweis: "Du bist unter 16? Dann brauchen wir die Einwilligung eines Elternteils. Trag unten einfach die E-Mail-Adresse deiner Eltern ein, wir schicken das Infopaket dorthin."
  eltern_email: "E-Mail eines Elternteils"
  sicherheit: "Keine Werbung von Dritten. Keine Weitergabe ohne dein Okay."

gruende:
  titel: "Warum Dachdecker:in?"
  liste:
    - kick: "Gesucht."
      titel: "Dich wollen alle."
      text: "1.100 Dachdeckerbetriebe allein in Westfalen, und fast alle suchen Nachwuchs. Nach der Gesellenprüfung hast du einen Job. Keine 50 Bewerbungen, keine Absagen."
    - kick: "1.050 €"
      titel: "Du verdienst ab Tag eins."
      text: "1.050 € im ersten, 1.200 € im zweiten, 1.460 € im dritten Lehrjahr. Tarif, kein Taschengeld. Eine der höchsten Ausbildungsvergütungen im Handwerk."
    - kick: "Hightech."
      titel: "Solar, Gründach, Drohne."
      text: "Dachdecker:innen montieren Photovoltaik, dämmen Häuser, begrünen Dächer und vermessen mit Drohnen. Der Beruf ist das Gegenteil von alt."
    - kick: "Meister:in."
      titel: "Dein Weg geht weiter."
      text: "Gesell:in, dann Meister:in, dann eigener Betrieb oder Bauleitung. Die Meisterschule ist direkt in Eslohe. Viele Betriebe suchen Nachfolger:innen."

ablauf:
  titel: "So geht's weiter"
  schritte:
    - titel: "Wir melden uns."
      text: "Innerhalb von 48 Stunden per WhatsApp oder Anruf. Kurzes Gespräch: Wo wohnst du, wann willst du starten, was ist dir wichtig."
    - titel: "Du kriegst Betriebe vorgeschlagen."
      text: "Zwei, drei Innungsbetriebe in deiner Nähe, die ausbilden. Du entscheidest, wen du kennenlernen willst."
    - titel: "Probearbeiten, dann Vertrag."
      text: "Zwei, drei Tage mitgehen und schauen, ob es passt. Wenn ja: unterschreiben. Wenn nicht: nächster Betrieb."

schule:
  titel: "Berufsschule in Eslohe"
  text: "Die Theorie lernst du nicht irgendwo, sondern an der Lorenz-Burmann-Schule im Sauerland, der Berufsschule des westfälischen Dachdeckerhandwerks. Zweimal im Jahr fünf Wochen am Stück, zusammen mit Azubis aus ganz Westfalen."
  punkte:
    - "Werkhallen für die überbetrieblichen Lehrgänge direkt auf dem Gelände"
    - "Schulabschluss nachholen: Hauptschulabschluss, mittlerer Abschluss, sogar Oberstufen-Berechtigung"
    - "Mensa, Freizeitangebote und abends Leute aus ganz Westfalen"

eltern:
  kicker: "Für Eltern"
  titel: "Ihr Kind will aufs Dach.<br>Gute Entscheidung."
  text: "Dachdecker:in ist ein Beruf mit Tarifvertrag, Zukunft und einem klaren Weg nach oben. Hier die Antworten auf die Fragen, die Eltern uns am häufigsten stellen."
  fragen:
    - frage: "Ist das nicht gefährlich?"
      antwort: "Die Arbeit in der Höhe ist Teil des Berufs, deshalb ist Absturzsicherung Ausbildungsinhalt vom ersten Tag an und Prüfungsstoff. Auf Baustellen gilt Gerüstpflicht. Sicherheit ist hier kein Appell, sondern Handwerk."
    - frage: "Was ist mit dem Schulabschluss?"
      antwort: "Am Berufskolleg in Eslohe kann Ihr Kind parallel zur Ausbildung den Hauptschulabschluss nachholen. Mit Berufsschulnote 3,0 gibt es die Fachoberschulreife, ab 2,5 die Berechtigung zur gymnasialen Oberstufe."
    - frage: "Wie läuft das mit Eslohe?"
      antwort: "Zweimal im Jahr fünf Wochen Blockunterricht. Die Azubis wohnen im schuleigenen Wohnheim mit Heimleitung und Sicherheitsdienst, Mensa inklusive. <span class=\"todo\">TODO: Kosten und Kostenträger</span>"
    - frage: "Hat der Beruf Zukunft?"
      antwort: "Photovoltaik, Dämmung, Gründächer: Die Energiewende findet auf dem Dach statt. Dächer lassen sich weder ins Ausland verlagern noch automatisieren. Dachdecker:innen werden heute gesucht und in zehn Jahren erst recht."
    - frage: "Was verdient mein Kind?"
      antwort: "Ab dem ersten Lehrjahr 1.050 € brutto im Monat nach Tarif, im dritten 1.460 €. Eine der höchsten Ausbildungsvergütungen im Handwerk. Danach Gesellenlohn nach Tarif."
    - frage: "Und danach?"
      antwort: "1.100 Innungsbetriebe allein in Westfalen, viele davon suchen Nachfolger:innen. Die Meisterschule ist direkt in Eslohe. <span class=\"todo\">TODO: Übernahmequote vom Verband</span>"
  cta_titel: "Lieber erst selbst lesen?"
  cta_text: "Fordern Sie das Infopaket an Ihre eigene E-Mail-Adresse an. Oder rufen Sie an, die Schule beantwortet Elternfragen gern persönlich."
  cta_button: "Infopaket an mich"

stimmen:
  titel: "Leute, die es gemacht haben"
  hinweis: "TODO: Echte Zitate und Fotos von Azubis und Ausbilder:innen der Schule. Platzhalter."
  liste:
    - zitat: "Ich wollte nie den ganzen Tag drinnen sitzen. Jetzt bin ich im zweiten Lehrjahr, hab mein eigenes Geld und weiß, dass mein Chef mich übernehmen will."
      name: "Platzhalter, 17"
      rolle: "Azubi, 2. Lehrjahr"
    - zitat: "Die Blockwochen in Eslohe sind das Beste. Man lernt Leute aus ganz Westfalen kennen und abends ist immer was los."
      name: "Platzhalter, 19"
      rolle: "Azubi, 3. Lehrjahr"
    - zitat: "Wir bilden aus, weil wir unsere Leute selbst am besten ausbilden können. Wer Bock hat, hat bei uns einen Platz."
      name: "Platzhalter"
      rolle: "Dachdeckermeister:in, Innungsbetrieb"

faq:
  titel: "Häufige Fragen"
  liste:
    - frage: "Welchen Schulabschluss brauche ich?"
      antwort: "Keinen bestimmten. Viele Azubis starten mit Hauptschulabschluss, manche ohne. Am Berufskolleg in Eslohe kannst du Abschlüsse während der Ausbildung nachholen."
    - frage: "Wie lange dauert die Ausbildung?"
      antwort: "Drei Jahre. Bei guten Leistungen kannst du die Gesellenprüfung vorziehen. Nach dem zweiten Lehrjahr gibt es eine Zwischenprüfung."
    - frage: "Was verdiene ich?"
      antwort: "Nach Tarif 1.050 € im ersten, 1.200 € im zweiten und 1.460 € im dritten Lehrjahr, brutto pro Monat. Als Gesell:in deutlich mehr, mit Meisterbrief noch einmal mehr."
    - frage: "Muss ich nach Eslohe ziehen?"
      antwort: "Nein. Du arbeitest in einem Betrieb in deiner Nähe. Nur für die Berufsschule bist du zweimal im Jahr für fünf Wochen in Eslohe und wohnst dann im Wohnheim."
    - frage: "Ist das nicht gefährlich?"
      antwort: "Du arbeitest in der Höhe, ja. Deshalb lernst du von Anfang an Absturzsicherung, und auf Baustellen gilt Gerüstpflicht. Sicherheit ist Teil der Ausbildung, nicht Nebensache."
    - frage: "Ich habe noch keinen Betrieb. Was jetzt?"
      antwort: "Genau dafür ist diese Seite. Fordere das Infopaket an, wir melden uns und schlagen dir Ausbildungsbetriebe in deiner Nähe vor."
    - frage: "Was passiert mit meinen Daten?"
      antwort: "Wir nutzen sie, um dir das Infopaket zu schicken und dich zu Ausbildungsbetrieben zu beraten. An Betriebe geben wir deine Daten erst weiter, wenn du das ausdrücklich willst. Details in den Datenschutzhinweisen."

abschluss:
  titel: "Bereit? Dann hol dir das Infopaket."
  text: "Infopaket holen oder direkt einen Betrieb finden lassen. Du sagst, was du willst, wir melden uns."
